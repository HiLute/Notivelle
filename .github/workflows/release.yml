# Релиз: тег vX.Y.Z → черновик GitHub Release с установщиками для Windows
# (NSIS и MSI), macOS (универсальный DMG: Apple Silicon и Intel) и пакетом
# для Arch Linux (.pkg.tar.zst). Версия в src-tauri/Cargo.toml должна
# совпадать с тегом; что ещё поменять при новой версии — packaging/README.md.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Сам релиз не публикуется: черновик проверяют, правят текст и выпускают
# руками (Releases → черновик → Edit → Publish release). Ссылка на черновик
# — в сводке запуска.
#
# Ручной запуск (Actions → Release → Run workflow) собирает всё то же самое,
# но черновик не создаёт: файлы остаются в артефактах запуска. Так конвейер
# можно проверить до тега.
#
# Если сборка по тегу упала, черновик остаётся: после исправления тег
# переставляют (git tag -f, git push --force origin vX.Y.Z), и запуск
# дополняет тот же черновик.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  draft:
    name: Черновик релиза
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      release-id: ${{ steps.create.outputs.release-id }}
    steps:
      - uses: actions/checkout@v4

      - name: Тег совпадает с версией в Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Тег $GITHUB_REF_NAME, а в src-tauri/Cargo.toml версия $version"
            exit 1
          fi

      # Если черновик для тега уже есть (сборка упала, ошибку исправили и тег
      # переставили на новый коммит), берём его: tauri-action и
      # `gh release upload --clobber` заменят файлы с теми же именами.
      # Опубликованный релиз не трогаем — для него нужна новая версия.
      - name: Создать черновик
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Черновик не найти по тегу (у него ещё нет страницы), поэтому
          # ищем его в списке релизов.
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | [.id, .draft] | @tsv" | head -n 1)
          if [ -n "$existing" ]; then
            read -r id draft <<< "$existing"
            if [ "$draft" != "true" ]; then
              echo "::error::Релиз $GITHUB_REF_NAME уже опубликован. Удалите его на GitHub или выпустите новую версию."
              exit 1
            fi
          else
            # id — из ответа на создание. Искать новый черновик в списке
            # нельзя: список обновляется не сразу, и черновика в нём может
            # ещё не быть. Так случилось с v0.2.0: id оказался пустым, и
            # установщики собрались, но в релиз не попали.
            id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$GITHUB_REF_NAME" \
              -f name="Notivelle ${GITHUB_REF_NAME#v}" \
              -F draft=true \
              -F body=@.github/release-notes.md \
              --jq .id)
          fi
          if [ -z "$id" ]; then
            echo "::error::Не удалось узнать id черновика релиза"
            exit 1
          fi
          echo "release-id=$id" >> "$GITHUB_OUTPUT"

  desktop:
    name: Сборка (${{ matrix.name }})
    needs: draft
    # Черновика нет при ручном запуске — собираем всё равно.
    if: ${{ !cancelled() && needs.draft.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            rust-targets: ''
            args: ''
          - name: macOS
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Зависимости фронтенда
        run: npm ci

      # Собирает фронтенд и программу, пакует установщики и загружает их в
      # черновик релиза. Без releaseId (ручной запуск) только собирает.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.draft.outputs.release-id }}
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true

  arch:
    name: Сборка (Arch Linux)
    needs: draft
    if: ${{ !cancelled() && needs.draft.result != 'failure' }}
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      # git нужен до checkout: иначе он скачает архив без истории, а версия
      # пакета считается по коммитам и тегам. Песочница загрузок pacman 7
      # (landlock) в контейнере Docker может не работать — отключаем её.
      - name: Пакеты для сборки
        run: |
          sed -i 's/^#DisableSandbox/DisableSandbox/' /etc/pacman.conf
          pacman -Syu --noconfirm --needed \
            git rust nodejs npm \
            cairo dbus gdk-pixbuf2 glib2 gtk3 libsoup3 webkit2gtk-4.1 \
            hicolor-icon-theme xdg-utils

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # makepkg не работает от root. PKGBUILD берёт исходники из этого же
      # репозитория (git+file), поэтому HEAD должен быть веткой, а не
      # отдельным коммитом тега.
      - name: makepkg
        run: |
          useradd --create-home builder
          chown -R builder: "$GITHUB_WORKSPACE"
          runuser -l builder -c "cd '$GITHUB_WORKSPACE' && git checkout -B release"
          runuser -l builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg --noconfirm"

      - uses: actions/upload-artifact@v4
        with:
          name: arch-linux
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error

  # Последний шаг: пакет Arch — в черновик, проверка, что в черновике есть
  # все установщики, и ссылка на него в сводке запуска. Публикует черновик
  # человек.
  finish:
    name: Черновик готов
    needs: [draft, desktop, arch]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ needs.draft.outputs.release-id }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: arch-linux
          path: arch

      - name: Пакет Arch — в черновик
        run: |
          gh release upload "$GITHUB_REF_NAME" arch/*.pkg.tar.zst \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Все установщики на месте
        run: |
          assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
            --jq '.[].name')
          echo "$assets"
          missing=0
          for pattern in '*_x64-setup.exe' '*_x64_*.msi' '*_universal.dmg' '*-x86_64.pkg.tar.zst'; do
            found=no
            while IFS= read -r name; do
              # Шаблон без кавычек: так [[ ]] сравнивает имя с маской.
              if [[ $name == $pattern ]]; then found=yes; fi
            done <<< "$assets"
            if [ "$found" = no ]; then
              echo "::error::В черновике нет файла $pattern"
              missing=1
            fi
          done
          exit "$missing"

      - name: Ссылка на черновик
        run: |
          url=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .html_url)
          {
            echo "### Черновик релиза $GITHUB_REF_NAME готов"
            echo
            echo "Проверьте файлы и текст, затем Edit → Publish release: $url"
          } >> "$GITHUB_STEP_SUMMARY"
