[package]
name = "notivelle"
version = "0.1.0"
description = "Obsidian-like Markdown editor for standalone files"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
# Имя библиотеки отличается от имени бинарника: так советует шаблон Tauri,
# чтобы на Windows не столкнулись одноимённые артефакты сборки.
# crate-type только rlib: staticlib/cdylib нужны лишь для мобильных платформ
# и заметно замедляют каждую сборку.
name = "notivelle_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0.21"
tempfile = "3.27.0"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
comrak = { version = "0.56.0", default-features = false }
ammonia = "4.2.3"
percent-encoding = "2.3.2"
tauri-plugin-opener = "2"
# Проверка орфографии по словарям Hunspell, на чистом Rust.
spellbook = "0.3"
notify = "8.2.0"
toml = "1.1.8"
fontdb = "0.24.0"
ttf-parser = "0.25.1"

[dev-dependencies]
proptest = "1.12.0"
serde_json = "1.0"

# Отладочная сборка без оптимизаций разбирала бы русский словарь (почти
# 150 тысяч основ) несколько секунд; оптимизируем только этот крейт.
[profile.dev.package.spellbook]
opt-level = 3

# Релизная сборка (пакеты): бинарник меньше и чуть быстрее ценой более
# долгой компиляции — LTO и одна единица кодогенерации дают компилятору
# оптимизировать программу целиком, strip убирает отладочные символы.
[profile.release]
codegen-units = 1
lto = true
strip = true

[lints.rust]
# Небезопасный код запрещён везде, кроме мест, явно помеченных
# `#[allow(unsafe_code)]`. Сейчас такое место одно: main.rs, установка
# переменной окружения для WebKitGTK.
unsafe_code = "deny"

[lints.clippy]
# pedantic — строгий набор проверок. Шумноват, но хорошо учит идиомам Rust.
pedantic = { level = "warn", priority = -1 }
# Каждый unsafe-блок обязан иметь комментарий `// SAFETY:` с обоснованием.
undocumented_unsafe_blocks = "deny"
